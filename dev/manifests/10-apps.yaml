# The workloads behind the routes: echo-basic, the Gateway API project's own
# test server, which answers every request with what it received.
#
# Every Service targets port 3000, where echo-basic listens; gRPC's is marked
# h2c so the gateway speaks HTTP/2 to it.

---
# shop/storefront: The shop's web front, version 1.
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: shop
spec:
  selector:
    app: storefront
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
        version: v1
    spec:
      containers:
        - name: echo
          image: registry.k8s.io/gateway-api/echo-basic:v1.5.1
          ports:
            - containerPort: 3000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
# shop/storefront-canary: Version 2, taking a tenth of /api through the weight split.
apiVersion: v1
kind: Service
metadata:
  name: storefront-canary
  namespace: shop
spec:
  selector:
    app: storefront-canary
  ports:
